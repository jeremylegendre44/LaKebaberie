<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradient de fond chaud et lumineux -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d2216"/>
      <stop offset="100%" stop-color="#2a150c"/>
    </radialGradient>

    <!-- Glow orange -->
    <radialGradient id="orangeGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Glow doré -->
    <radialGradient id="goldGlow" cx="70%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Fond chaud -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#orangeGlow)"/>
  <rect width="400" height="400" fill="url(#goldGlow)"/>

  <!-- Motifs décoratifs - Kebab/Döner -->
  <g opacity="0.18" fill="#ff7043">
    <!-- Kebab 1 -->
    <ellipse cx="55" cy="45" rx="28" ry="40" transform="rotate(-15 55 45)"/>
    <ellipse cx="55" cy="45" rx="20" ry="32" fill="#ff5722" transform="rotate(-15 55 45)"/>
    <rect x="50" y="80" width="10" height="45" rx="3" fill="#ffd54f"/>

    <!-- Kebab 2 -->
    <ellipse cx="350" cy="160" rx="22" ry="35" transform="rotate(10 350 160)"/>
    <ellipse cx="350" cy="160" rx="15" ry="26" fill="#ff5722" transform="rotate(10 350 160)"/>
    <rect x="345" y="190" width="10" height="40" rx="3" fill="#ffd54f"/>
  </g>

  <!-- Motifs - Frites dorées -->
  <g opacity="0.2" fill="#ffd54f">
    <!-- Groupe de frites 1 -->
    <rect x="115" y="15" width="10" height="55" rx="3" transform="rotate(-22 115 15)"/>
    <rect x="135" y="8" width="10" height="60" rx="3" transform="rotate(-12 135 8)"/>
    <rect x="155" y="12" width="10" height="55" rx="3" transform="rotate(5 155 12)"/>
    <rect x="172" y="18" width="10" height="50" rx="3" transform="rotate(18 172 18)"/>

    <!-- Groupe de frites 2 -->
    <rect x="275" y="310" width="10" height="55" rx="3" transform="rotate(155 275 310)"/>
    <rect x="295" y="305" width="10" height="60" rx="3" transform="rotate(168 295 305)"/>
    <rect x="318" y="312" width="10" height="52" rx="3" transform="rotate(-175 318 312)"/>
  </g>

  <!-- Motifs - Burger coloré -->
  <g opacity="0.2">
    <!-- Burger 1 -->
    <ellipse cx="50" cy="275" rx="40" ry="14" fill="#ffb74d"/>
    <ellipse cx="50" cy="268" rx="36" ry="10" fill="#ffa726"/>
    <rect x="12" y="255" width="76" height="18" rx="4" fill="#a1887f"/>
    <path d="M15 268 Q30 280 50 268 Q70 280 85 268" stroke="#7cb342" stroke-width="5" fill="none"/>
    <ellipse cx="50" cy="280" rx="40" ry="12" fill="#ffb74d"/>

    <!-- Burger 2 -->
    <ellipse cx="380" cy="375" rx="32" ry="12" fill="#ffb74d"/>
    <rect x="350" y="362" width="60" height="14" rx="3" fill="#a1887f"/>
    <ellipse cx="380" cy="358" rx="30" ry="10" fill="#ffa726"/>
  </g>

  <!-- Motifs - Tacos/Wrap -->
  <g opacity="0.18" fill="#ffcc80">
    <!-- Tacos 1 -->
    <path d="M200 75 Q235 50 250 90 Q225 105 200 95 Q175 105 150 90 Q165 50 200 75"/>
    <ellipse cx="200" cy="88" rx="35" ry="10" fill="#a1887f" opacity="0.6"/>

    <!-- Tacos 2 -->
    <path d="M75 190 Q105 165 118 200 Q95 215 75 205 Q55 215 32 200 Q45 165 75 190" transform="rotate(15 75 195)"/>
  </g>

  <!-- Cercles décoratifs lumineux (oignons/tomates) -->
  <g opacity="0.15">
    <circle cx="300" cy="75" r="28" stroke="#ff7043" stroke-width="6" fill="none"/>
    <circle cx="330" cy="55" r="15" stroke="#ffab40" stroke-width="4" fill="none"/>
    <circle cx="95" cy="350" r="22" stroke="#ff8a65" stroke-width="5" fill="none"/>
    <circle cx="65" cy="370" r="12" stroke="#ffd54f" stroke-width="3" fill="none"/>
    <circle cx="250" cy="250" r="20" stroke="#ff7043" stroke-width="5" fill="none"/>
  </g>

  <!-- Points éparpillés brillants (épices/sésame) -->
  <g opacity="0.35" fill="#ffd54f">
    <circle cx="42" cy="120" r="4"/>
    <circle cx="88" cy="92" r="3"/>
    <circle cx="180" cy="145" r="3.5"/>
    <circle cx="225" cy="185" r="3"/>
    <circle cx="285" cy="225" r="4"/>
    <circle cx="355" cy="285" r="3"/>
    <circle cx="325" cy="355" r="3.5"/>
    <circle cx="148" cy="305" r="3"/>
    <circle cx="198" cy="355" r="4"/>
    <circle cx="385" cy="48" r="3"/>
    <circle cx="18" cy="205" r="3.5"/>
    <circle cx="375" cy="118" r="3"/>
    <circle cx="128" cy="385" r="3"/>
  </g>

  <!-- Motifs - Piment/Épice -->
  <g opacity="0.25" fill="#f44336">
    <path d="M365 25 Q375 15 385 30 Q380 50 365 58 Q350 50 345 30 Q355 15 365 25"/>
    <path d="M365 58 Q365 63 370 61" stroke="#4caf50" stroke-width="2" fill="none"/>

    <path d="M25 325 Q35 315 45 330 Q40 350 25 358 Q10 350 5 330 Q15 315 25 325" transform="rotate(35 25 340)"/>
    <path d="M25 358 Q25 363 30 361" stroke="#4caf50" stroke-width="2" fill="none" transform="rotate(35 25 340)"/>
  </g>

  <!-- Lignes décoratives ondulées (fumée/vapeur) -->
  <g opacity="0.12" stroke="#ffab91" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M45 145 Q60 130 75 145 Q90 160 105 145"/>
    <path d="M335 245 Q350 230 365 245 Q380 260 395 245"/>
    <path d="M175 385 Q190 370 205 385 Q220 400 235 385"/>
  </g>

  <!-- Étincelles dorées -->
  <g opacity="0.3" fill="#fff8e1">
    <polygon points="260,30 262,36 269,36 264,40 266,47 260,43 254,47 256,40 251,36 258,36"/>
    <polygon points="140,220 142,225 148,225 143,228 145,234 140,231 135,234 137,228 132,225 138,225" transform="scale(0.8)"/>
    <polygon points="350,320 352,326 359,326 354,330 356,337 350,333 344,337 346,330 341,326 348,326" transform="scale(0.7)"/>
  </g>
</svg>
