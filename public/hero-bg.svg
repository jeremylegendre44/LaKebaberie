<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradients plus lumineux -->
    <radialGradient id="heroGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff8c42" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff6b2c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#e63027" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow3" cx="50%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#ffd966" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffc72c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow4" cx="70%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#ffaa33" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond de base plus chaud -->
  <rect width="1200" height="600" fill="#2d1a0f"/>

  <!-- Glows ambiants lumineux -->
  <rect width="1200" height="600" fill="url(#heroGlow1)"/>
  <rect width="1200" height="600" fill="url(#heroGlow2)"/>
  <rect width="1200" height="600" fill="url(#heroGlow3)"/>
  <rect width="1200" height="600" fill="url(#heroGlow4)"/>

  <!-- Grand kebab stylisé à droite - plus visible -->
  <g transform="translate(980, 80)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="90" ry="170" fill="#ff7b3a" transform="rotate(-10)"/>
    <ellipse cx="0" cy="0" rx="70" ry="145" fill="#ff5722" transform="rotate(-10)"/>
    <ellipse cx="0" cy="0" rx="50" ry="110" fill="#e64a19" transform="rotate(-10)"/>
    <!-- Broche dorée -->
    <rect x="-10" y="160" width="20" height="220" fill="#ffd54f" rx="5"/>
    <rect x="-6" y="160" width="12" height="220" fill="#ffca28" rx="3"/>
  </g>

  <!-- Burger stylisé en bas à gauche - plus coloré -->
  <g transform="translate(120, 420)" opacity="0.3">
    <!-- Pain du haut brillant -->
    <ellipse cx="0" cy="-50" rx="110" ry="40" fill="#ffb74d"/>
    <ellipse cx="0" cy="-58" rx="95" ry="28" fill="#ffa726"/>
    <!-- Graines de sésame -->
    <ellipse cx="-40" cy="-65" rx="6" ry="4" fill="#fff8e1" opacity="0.7"/>
    <ellipse cx="-10" cy="-70" rx="5" ry="3" fill="#fff8e1" opacity="0.7"/>
    <ellipse cx="25" cy="-68" rx="6" ry="4" fill="#fff8e1" opacity="0.7"/>
    <ellipse cx="55" cy="-62" rx="5" ry="3" fill="#fff8e1" opacity="0.7"/>
    <!-- Viande juteuse -->
    <ellipse cx="0" cy="0" rx="100" ry="22" fill="#8d6e63"/>
    <ellipse cx="0" cy="-5" rx="95" ry="18" fill="#a1887f"/>
    <!-- Fromage fondu -->
    <path d="M-95 15 Q-80 35 -50 20 Q-20 40 20 18 Q50 38 80 22 Q100 35 95 15" fill="#ffca28" opacity="0.9"/>
    <!-- Salade verte -->
    <path d="M-100 25 Q-70 45 -35 25 Q0 48 35 25 Q70 48 100 25" stroke="#7cb342" stroke-width="12" fill="none"/>
    <!-- Tomate -->
    <ellipse cx="-30" cy="35" rx="25" ry="8" fill="#ef5350"/>
    <ellipse cx="40" cy="38" rx="22" ry="7" fill="#ef5350"/>
    <!-- Pain du bas -->
    <ellipse cx="0" cy="55" rx="110" ry="35" fill="#ffb74d"/>
  </g>

  <!-- Frites dorées -->
  <g opacity="0.25" fill="#ffd54f">
    <rect x="80" y="130" width="14" height="70" rx="4" transform="rotate(-30 80 130)"/>
    <rect x="110" y="115" width="14" height="80" rx="4" transform="rotate(-18 110 115)"/>
    <rect x="145" y="120" width="14" height="75" rx="4" transform="rotate(-5 145 120)"/>
    <rect x="175" y="125" width="14" height="68" rx="4" transform="rotate(8 175 125)"/>

    <rect x="820" y="380" width="12" height="65" rx="4" transform="rotate(155 820 380)"/>
    <rect x="855" y="390" width="12" height="58" rx="4" transform="rotate(170 855 390)"/>
    <rect x="890" y="375" width="12" height="70" rx="4" transform="rotate(145 890 375)"/>
  </g>

  <!-- Tacos généreux -->
  <g transform="translate(580, 480)" opacity="0.25">
    <path d="M0 -10 Q60 -80 100 -10 Q60 15 0 15 Q-60 15 -100 -10 Q-60 -80 0 -10" fill="#ffcc80"/>
    <path d="M0 -5 Q50 -65 85 -5" stroke="#8d6e63" stroke-width="15" fill="none" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="70" ry="14" fill="#a1887f" opacity="0.7"/>
    <!-- Garniture qui dépasse -->
    <circle cx="-30" cy="-20" r="8" fill="#7cb342"/>
    <circle cx="15" cy="-25" r="6" fill="#ef5350"/>
    <circle cx="40" cy="-18" r="7" fill="#ffca28"/>
  </g>

  <!-- Vapeur/Fumée chaude -->
  <g opacity="0.2" stroke="#ffab91" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M920 320 Q945 280 920 240 Q945 200 920 160"/>
    <path d="M955 330 Q980 285 955 240 Q980 195 955 150"/>
    <path d="M990 325 Q1015 280 990 235 Q1015 190 990 145"/>
  </g>

  <!-- Cercles décoratifs lumineux (oignons/tomates) -->
  <g opacity="0.2">
    <circle cx="320" cy="90" r="45" stroke="#ff7043" stroke-width="10" fill="none"/>
    <circle cx="520" cy="70" r="30" stroke="#ffab40" stroke-width="8" fill="none"/>
    <circle cx="1080" cy="420" r="40" stroke="#ffd54f" stroke-width="8" fill="none"/>
    <circle cx="200" cy="320" r="25" stroke="#ff8a65" stroke-width="6" fill="none"/>
  </g>

  <!-- Points éparpillés brillants (sésame/épices) -->
  <g opacity="0.4" fill="#ffd54f">
    <circle cx="220" cy="190" r="5"/>
    <circle cx="270" cy="165" r="4"/>
    <circle cx="420" cy="110" r="5"/>
    <circle cx="580" cy="180" r="4"/>
    <circle cx="720" cy="140" r="5"/>
    <circle cx="780" cy="230" r="4"/>
    <circle cx="480" cy="330" r="5"/>
    <circle cx="370" cy="380" r="4"/>
    <circle cx="650" cy="350" r="5"/>
    <circle cx="1020" cy="280" r="4"/>
    <circle cx="1120" cy="180" r="5"/>
  </g>

  <!-- Étoiles/Étincelles -->
  <g opacity="0.35" fill="#fff3e0">
    <polygon points="400,50 403,58 412,58 405,63 408,72 400,67 392,72 395,63 388,58 397,58" />
    <polygon points="750,100 752,106 759,106 754,110 756,117 750,113 744,117 746,110 741,106 748,106" transform="scale(0.8)"/>
    <polygon points="1100,350 1103,358 1112,358 1105,363 1108,372 1100,367 1092,372 1095,363 1088,358 1097,358" transform="scale(0.7)"/>
  </g>

  <!-- Piments rouges vifs -->
  <g opacity="0.3" fill="#f44336">
    <path d="M40 70 Q55 45 70 70 Q62 115 50 125 Q38 115 30 70 Q45 45 40 70"/>
    <path d="M50 125 Q50 130 55 128" stroke="#4caf50" stroke-width="3" fill="none"/>

    <path d="M1140 480 Q1155 455 1170 480 Q1162 525 1150 535 Q1138 525 1130 480 Q1145 455 1140 480" transform="rotate(-25 1150 505)"/>
    <path d="M1150 535 Q1150 540 1155 538" stroke="#4caf50" stroke-width="3" fill="none" transform="rotate(-25 1150 505)"/>
  </g>

  <!-- Lignes de chaleur ondulées -->
  <g opacity="0.1" stroke="#ffab91" stroke-width="3" fill="none">
    <path d="M0 280 Q80 255 160 280 Q240 305 320 280 Q400 255 480 280 Q560 305 640 280 Q720 255 800 280 Q880 305 960 280 Q1040 255 1120 280 Q1200 305 1200 280"/>
    <path d="M0 330 Q80 355 160 330 Q240 305 320 330 Q400 355 480 330 Q560 305 640 330 Q720 355 800 330 Q880 305 960 330 Q1040 355 1120 330 Q1200 305 1200 330"/>
  </g>
</svg>
