<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Fond noir -->
  <rect width="800" height="800" fill="#0a0a0a"/>

  <!-- Glow principal -->
  <ellipse cx="400" cy="100" rx="400" ry="300" fill="url(#glowTop)"/>
  <ellipse cx="0" cy="400" rx="300" ry="400" fill="url(#glowLeft)"/>
  <ellipse cx="800" cy="700" rx="350" ry="300" fill="url(#glowRight)"/>

  <defs>
    <radialGradient id="glowTop">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Lignes décoratives -->
  <g stroke="#f5a623" stroke-width="1" opacity="0.03">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
  </g>

  <!-- Points dorés épars -->
  <g fill="#f5a623" opacity="0.08">
    <circle cx="100" cy="150" r="3"/>
    <circle cx="300" cy="80" r="2"/>
    <circle cx="500" cy="200" r="2.5"/>
    <circle cx="700" cy="120" r="2"/>
    <circle cx="150" cy="350" r="2"/>
    <circle cx="650" cy="380" r="3"/>
    <circle cx="50" cy="550" r="2"/>
    <circle cx="400" cy="500" r="2.5"/>
    <circle cx="750" cy="550" r="2"/>
    <circle cx="200" cy="700" r="3"/>
    <circle cx="550" cy="680" r="2"/>
    <circle cx="350" cy="750" r="2.5"/>
  </g>

  <!-- Formes food très subtiles -->
  <g opacity="0.02" fill="#f5a623">
    <!-- Burger abstrait -->
    <ellipse cx="120" cy="250" rx="40" ry="15"/>
    <rect x="82" y="255" width="76" height="12" rx="3"/>
    <ellipse cx="120" cy="275" rx="40" ry="15"/>

    <!-- Tacos abstrait -->
    <path d="M650 300 Q700 250 750 300 Q720 320 700 310 Q680 320 650 300 Z"/>

    <!-- Kebab abstrait -->
    <ellipse cx="80" cy="600" rx="25" ry="35"/>
    <rect x="77" y="635" width="6" height="40" rx="2"/>

    <!-- Frites -->
    <rect x="680" y="620" width="8" height="45" rx="2" transform="rotate(-10 684 642)"/>
    <rect x="695" y="615" width="8" height="50" rx="2"/>
    <rect x="710" y="618" width="8" height="47" rx="2" transform="rotate(8 714 641)"/>
  </g>
</svg>
