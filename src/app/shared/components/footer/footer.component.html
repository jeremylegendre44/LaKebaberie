<footer class="footer" aria-label="Pied de page">
  <div class="footer__inner">
    <div class="footer__left">
      <div class="footer__brand">{{ brandName() }}</div>
      <div class="footer__muted">
        © {{ year() }}
        @if (city()) {
          — {{ city() }}
        }
      </div>
    </div>
    @if (rightText()) {
      <div class="footer__right footer__muted">
        {{ rightText() }}
      </div>
    }
  </div>
</footer>
