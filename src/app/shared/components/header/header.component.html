<header class="topbar" aria-label="En-tête">
  <div class="brand" [attr.aria-label]="brandName">
    <div class="brand__mark" aria-hidden="true">LK</div>
    <div class="brand__text">
      <div class="brand__name">{{ brandName }}</div>
      <div *ngIf="brandCity" class="brand__city">{{ brandCity }}</div>
    </div>
  </div>

  <nav class="nav" aria-label="Navigation principale">
    <a *ngFor="let link of navLinks" [ngClass]="link.isCta ? 'nav__cta' : 'nav__link'" [href]="link.href">
      {{ link.label }}
    </a>

    <button class="nav__cta theme-toggle" type="button" (click)="toggleTheme()" aria-label="Basculer thème" [attr.aria-pressed]="(theme$ | async) === true">
      <!-- Sun SVG for light -->
      <svg *ngIf="(theme$ | async) === false" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="currentColor" />
        <g stroke="currentColor" stroke-width="2">
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="M4.2 4.2l1.4 1.4" />
          <path d="M18.4 18.4l1.4 1.4" />
          <path d="M4.2 19.8l1.4-1.4" />
          <path d="M18.4 5.6l1.4-1.4" />
        </g>
      </svg>
      <!-- Moon SVG for dark -->
      <svg *ngIf="(theme$ | async) === true" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor" />
      </svg>
    </button>
  </nav>
</header>
